apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: laravel-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: laravel-platform
  source:
    repoURL: https://github.com/tconuorah/laravel-eks-app-repo.git
    targetRevision: b8d75f713bf0efc1ee1e8e24b960a0f9b7b83400 # gitops-source-revision
    path: laravel-helm
    helm:
      releaseName: laravel
      values: |
        fullnameOverride: laravel
        image:
          nginx:
            repository: 022440376442.dkr.ecr.us-east-2.amazonaws.com/nginx
            tag: "b8d75f713bf0" # gitops-nginx-tag
            pullPolicy: IfNotPresent
          php:
            repository: 022440376442.dkr.ecr.us-east-2.amazonaws.com/php
            tag: "b8d75f713bf0" # gitops-php-tag
            pullPolicy: IfNotPresent
        ingress:
          enabled: true
          className: alb
          targetType: ip
          scheme: internet-facing
          certificateArn: ""
          sslRedirect: false
          hosts:
            - host: ""
              paths:
                - path: /
                  pathType: Prefix
        app:
          url: https://laravel-dev.example.com
        secret:
          create: false
          existingSecret: laravel-env
  destination:
    server: https://kubernetes.default.svc
    namespace: laravel
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
