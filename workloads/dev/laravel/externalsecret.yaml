apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: laravel-env
  namespace: laravel
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: laravel-env
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: php-nginx-app-dev/laravel/runtime
